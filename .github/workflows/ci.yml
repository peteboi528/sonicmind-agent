name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision,embeddings]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=75

      - name: Long dialogue smoke
        run: python scripts/long_dialogue_smoke.py

      - name: Cross-session memory regression
        run: python scripts/realistic_memory_eval.py

      - name: Upload Agent regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-regression-py${{ matrix.python-version }}
          path: |
            artifacts/long_dialogue_smoke_report.*
            artifacts/realistic_memory_eval_report.*
          if-no-files-found: ignore
